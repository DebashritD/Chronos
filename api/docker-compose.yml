services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
    ports:
      - "5433:5432"   # 5432 is left free for Dionysus
    volumes:
      - chronos-pg:/var/lib/postgresql/data

volumes:
  chronos-pg:
